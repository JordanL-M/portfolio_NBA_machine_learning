[project]
name = "project_name"
version = "0.1.0"
description = "Data analysis and reporting project"
requires-python = ">=3.11"
dependencies = [
    "marimo",
    "polars",
    "pandas",
    "numpy",
    "matplotlib",
    "altair",
    "jupyter",
    "ipykernel",
    "duckdb",
    "parquet"
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
